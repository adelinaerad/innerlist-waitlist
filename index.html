<style>
:root{
  --canvas:#16302b; --deep:#162127; --room:#0d1511; --card:#e6d8bf; --card-line:#cdbc9e;
  --ink:#ffffff; --muted:#b5ccbf; --accent:#c9ad84; --brass:#a38560; --soft:#4e493e;
  --btn:#322c25; --danger:#e08a7d; --warn:#d9a441;
  --serif:Lora, Georgia, "Times New Roman", serif; --text:Georgia, Gelasio, "Times New Roman", serif;
  --head:88px; --pad:72px; --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100svh;background:var(--room);color:var(--ink);font-family:var(--text);display:flex;flex-direction:column;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}a:hover{color:var(--card)}
:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* backdrops */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.08);opacity:0;transition:opacity 1.4s ease}
.bg img.on{opacity:1}
.bg::after{content:"";position:absolute;inset:0;background:rgba(13,21,17,.6)}

/* header */
header{position:relative;z-index:60;height:var(--head);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad)}
.wordmark{background:none;border:0;padding:0;font-size:13px;line-height:16px;font-weight:500;letter-spacing:5px;color:var(--ink)}
.nav{display:flex;align-items:center;gap:28px}
.nav-link{background:none;border:0;padding:0;font-size:15px;color:var(--accent)}
.nav-link:hover{color:var(--card)}
.lang{display:flex;gap:4px;padding:3px;border:1px solid var(--soft);border-radius:999px}
.lang button{min-width:44px;height:32px;padding:0 10px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:13px;letter-spacing:1px}
.lang button[aria-pressed="true"]{background:var(--card);color:var(--deep)}

/* screens */
main{position:relative;z-index:1;flex:1;display:flex;flex-direction:column}
.screen{display:none;flex:1;position:relative}
.screen.active{display:flex}
.center{flex-direction:column;align-items:center;justify-content:center;text-align:center}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:16px var(--pad) 56px}

/* reveal */
.rv{opacity:0;transform:translateY(14px);transition:opacity .9s ease,transform .9s ease}
.rv.on{opacity:1;transform:none}
.fade{opacity:0;transition:opacity .8s ease;pointer-events:none}
.fade.on{opacity:1;pointer-events:auto}
.rise{opacity:0;transform:translateY(60px);transition:opacity 1s ease,transform 1s var(--ease)}
.rise.on{opacity:1;transform:none}

/* type */
.display{font-family:var(--serif);font-weight:500;font-size:clamp(36px,5vw,64px);line-height:1.06;letter-spacing:-.3px}
.h2{font-family:var(--serif);font-weight:500;font-size:clamp(30px,3.6vw,48px);line-height:1.06}
.h3{font-family:var(--serif);font-weight:600;font-size:clamp(22px,2.2vw,30px);line-height:1.1}
.lead{font-size:clamp(16px,1.35vw,19px);line-height:1.62;color:var(--muted)}
.body{font-size:15px;line-height:23px;color:var(--muted)}
.small{font-size:13px;line-height:19px;color:var(--muted)}
.label{font-size:11px;line-height:14px;font-weight:500;letter-spacing:3px;text-transform:uppercase}
.italic{font-family:var(--serif);font-style:italic;font-weight:500}

/* buttons */
.btn{height:52px;padding:0 32px;background:var(--btn);border:1px solid var(--brass);border-radius:10px;color:var(--ink);font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;transition:background-color .25s ease}
.btn:hover{background:#3d352c;color:var(--ink)}
.link{height:44px;padding:0 8px;background:none;border:0;color:var(--accent);font-size:15px}
.link:hover{color:var(--card)}
.chip{height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--brass);background:rgba(22,33,39,.6);color:var(--ink);font-size:15px;transition:background-color .3s ease,border-color .3s ease,color .3s ease}
.chip[aria-pressed="true"]{background:var(--card);border-color:var(--card);color:var(--deep)}
.chip.t-inner[aria-pressed="true"]{background:#3a3c3a;border-color:#8a8c88;color:#fff}
.chip.t-innerly[aria-pressed="true"]{background:#4a3321;border-color:#a0795a;color:#fff}
.chip.t-innerlist[aria-pressed="true"]{background:#16302b;border-color:var(--accent);color:#fff}

/* fields */
.field{display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:22px;text-align:left}
.field input,.field textarea{height:48px;padding:0 14px;background:var(--deep);border:1px solid var(--brass);border-radius:10px;color:var(--ink);font-size:16px}
.field textarea{height:auto;padding:12px 14px;line-height:22px;resize:none}
.field input::placeholder{color:var(--muted);opacity:.7}
.field input:focus,.field textarea:focus{outline:2px solid var(--brass);outline-offset:1px}
.error{font-size:13px;line-height:19px;color:var(--danger)}
.check{display:flex;align-items:flex-start;gap:12px;font-size:13px;line-height:19px;color:var(--muted);text-align:left;cursor:pointer}
.check input{width:20px;height:20px;margin:0;flex-shrink:0;accent-color:var(--brass)}
fieldset{margin:0;padding:0;border:0;text-align:left}
legend{padding:0 0 10px;font-size:15px;line-height:22px}
.chips{display:flex;flex-wrap:wrap;gap:10px}

/* curtain */
#curtain{position:fixed;left:0;right:0;top:calc(var(--head) + env(safe-area-inset-top,0px));bottom:0;z-index:50}
#curtain[data-state="open"]{pointer-events:none}
#curtain[hidden]{display:none}
.panel{position:absolute;top:0;width:50%;height:100%;background-color:#10261f;
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,0) 0,rgba(0,0,0,.30) 23px,rgba(255,255,255,.045) 39px,rgba(0,0,0,0) 58px),repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0,rgba(0,0,0,0) 47px,rgba(255,255,255,.05) 71px,rgba(0,0,0,.22) 113px),repeating-linear-gradient(90deg,rgba(0,0,0,0) 0,rgba(0,0,0,.2) 90px,rgba(0,0,0,0) 173px),linear-gradient(180deg,rgba(0,0,0,.4) 0%,rgba(0,0,0,0) 20%,rgba(0,0,0,0) 72%,rgba(0,0,0,.5) 100%);
  transition:transform 1.25s cubic-bezier(.65,0,.25,1)}
.panel.l{left:0;transform-origin:left center;box-shadow:inset -40px 0 50px -20px rgba(0,0,0,.55)}
.panel.r{right:0;transform-origin:right center;box-shadow:inset 40px 0 50px -20px rgba(0,0,0,.55)}
#curtain.opening .panel,#curtain[data-state="open"] .panel{transform:scaleX(.07)}
.seal-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding-bottom:40px;transition:opacity .3s ease}
#curtain.opening .seal-wrap,#curtain[data-state="open"] .seal-wrap{opacity:0;pointer-events:none}
.seal{position:relative;width:340px;height:340px;padding:0;border:0;border-radius:999px;background:transparent;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.seal svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.seal img{position:absolute;inset:6%;width:88%;height:88%;border-radius:999px;pointer-events:none}
.ring{stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .32s ease-out}
.holding .ring{transition:none}
.seal-hint{font-size:15px;line-height:21px;color:var(--card);padding:0 32px;text-align:center}

/* gate */
#gate .layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 var(--pad) 48px}
#intro{gap:26px}
#intro h1{display:flex;flex-direction:column;align-items:center}
#intro .lead{max-width:580px}
#intro .beta{max-width:520px;padding-top:20px;border-top:1px solid var(--soft)}
#choose{gap:32px;opacity:0;transform:translateY(14px);transition:opacity 1.1s ease,transform 1.1s ease;pointer-events:none}
#choose.on{opacity:1;transform:none;pointer-events:auto}
.doors{display:flex;align-items:flex-start;justify-content:center;gap:72px}
.door{display:flex;flex-direction:column;align-items:center;gap:18px;padding:0;background:none;border:0;color:var(--ink);text-decoration:none;flex:0 1 320px;min-width:0}
.arch{position:relative;display:block;width:100%;max-width:320px;aspect-ratio:320/430;border:1px solid var(--brass);border-radius:999px 999px 14px 14px;overflow:hidden;background:var(--room);transition:border-color .4s ease}
.door:hover .arch,.door:focus-visible .arch{border-color:var(--card)}
.arch img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.spot{--x:50%;--y:52%;--a:60px;--b:260px;--d:.9;position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--x) var(--y),rgba(13,21,17,0) 0,rgba(13,21,17,0) var(--a),rgba(13,21,17,var(--d)) var(--b))}
.door-text{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:280px}
.door-title{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.1}
.skip{position:absolute;right:var(--pad);bottom:16px;z-index:55}
.skip[hidden]{display:none}

/* tiers */
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;width:100%;text-align:left;margin:40px 0}
.tier{padding:32px;border-radius:14px;display:flex;flex-direction:column;gap:18px;border:1px solid}
.tier .meta{display:flex;flex-direction:column;gap:8px}
.tier ul{padding-top:20px;border-top:1px solid;display:flex;flex-direction:column;gap:12px}
.tier li{font-size:15px;line-height:23px}
.tier-inner{background:#3a3c3a;border-color:#5d605c}.tier-inner ul{border-color:#5d605c}.tier-inner li{color:#d4d5d1}.tier-inner .acc{color:var(--accent)}
.tier-innerly{background:#4a3321;border-color:#7a5a3e}.tier-innerly ul{border-color:#7a5a3e}.tier-innerly li{color:#dfd0b8}.tier-innerly .acc{color:var(--card)}
.tier-innerlist{background:#16302b;border-color:var(--brass)}.tier-innerlist ul{border-color:#3d5a50}.tier-innerlist li{color:var(--muted)}.tier-innerlist .acc{color:var(--accent)}
.promise{font-size:18px;line-height:26px}
.acc{font-size:14px;line-height:20px}
.cta-stack{display:flex;flex-direction:column;align-items:center;gap:6px}
.note{max-width:640px;margin-bottom:18px;font-size:15px;line-height:24px;color:var(--muted)}

/* member form */
.form{width:100%;max-width:560px;display:flex;flex-direction:column;gap:22px;margin:0 auto}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.span2{grid-column:span 2}

/* done */
.done{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"text visual" "actions visual";gap:24px 96px;align-items:center;width:100%;max-width:1200px;margin:0 auto;padding:8px var(--pad) 56px;text-align:left}
.done-text{grid-area:text;align-self:end;display:flex;flex-direction:column;gap:20px;max-width:520px}
.done-actions{grid-area:actions;align-self:start;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.done-visual{grid-area:visual;justify-self:center;display:flex;flex-direction:column;align-items:center;gap:20px}
.dial-box{display:flex;flex-direction:column;align-items:center;gap:4px}
.dial{position:relative;width:260px;height:136px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.dial svg{position:absolute;inset:0;overflow:visible}
.dial-arc{stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .7s var(--ease)}
.knob{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;padding:0;border:1px solid var(--brass);border-radius:999px;background:var(--card);transition:left .7s var(--ease),top .7s var(--ease)}
.dragging .dial-arc,.dragging .knob,.dragging .ticket-inner{transition:none!important}
.dial-hint{font-size:13px;line-height:19px;color:var(--accent);text-align:center}
.ticket{width:min(420px,calc(100vw - 48px));height:440px;perspective:1200px}
.ticket-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:rotateY(180deg);transition:transform .8s var(--ease)}
.ticket-inner.tilt{transition:transform .12s ease-out}
.face{position:absolute;inset:0;border-radius:20px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{background:var(--card);color:var(--deep);display:flex;flex-direction:column;
  -webkit-mask-image:radial-gradient(circle at 0 202px,transparent 12px,#000 12.5px),radial-gradient(circle at 100% 202px,transparent 12px,#000 12.5px);-webkit-mask-composite:source-in;
  mask-image:radial-gradient(circle at 0 202px,transparent 12px,#000 12.5px),radial-gradient(circle at 100% 202px,transparent 12px,#000 12.5px);mask-composite:intersect}
.front .top{height:190px;flex-shrink:0;padding:32px 32px 24px;display:flex;flex-direction:column;gap:20px}
.front .perf{position:relative;height:24px;flex-shrink:0}
.front .perf::before{content:"";position:absolute;left:24px;right:24px;top:11px;border-top:1.5px dashed var(--brass)}
.front .bottom{flex:1;padding:20px 32px 32px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.kv{display:flex;flex-direction:column;gap:4px}
.kv .k{font-size:13px;line-height:19px;color:#322c25}
.kv .v{font-size:15px;line-height:22px;color:var(--deep)}
.place{display:flex;align-items:baseline;justify-content:space-between}
.place-no{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1}
.code-box{background:#fff;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px}
.code{font-size:20px;line-height:26px;letter-spacing:3px}
.code-link{font-size:13px;line-height:19px;color:#322c25;user-select:all;word-break:break-all}
.sheen{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s ease;background:radial-gradient(circle at var(--sx,50%) var(--sy,50%),rgba(255,255,255,.22) 0,rgba(255,255,255,0) 220px)}
.tilting .sheen{opacity:1}
.back{transform:rotateY(180deg);background:var(--canvas);border:1px solid var(--brass);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:40px 32px;text-align:center}
.back img{width:200px;height:200px;border-radius:999px}

/* host */
#hintro .layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 var(--pad) 48px}
#h-lines{gap:26px}
#h-lines .italic{font-size:clamp(22px,2.2vw,28px);line-height:1.3;color:var(--card)}
#h-lines .lead{max-width:600px}
#h-aud{gap:40px;pointer-events:none}
#h-aud.live{pointer-events:auto}
.aud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;width:100%;max-width:1200px;text-align:left}
.aud section{padding:28px;background:rgba(22,33,39,.88);border:1px solid var(--soft);border-radius:14px;display:flex;flex-direction:column;gap:14px}
.aud h3{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.1}
.aud .p1{font-size:18px;line-height:26px}
.aud .p2{padding-top:14px;border-top:1px solid var(--soft);font-size:15px;line-height:23px;color:var(--muted)}
.how{position:relative;width:100%;max-width:1120px;margin:44px 0;text-align:left}
.how-track,.how-fill{position:absolute;left:20px;right:20px;top:20px;height:1px;background:var(--soft)}
.how-fill{background:var(--accent);transform:scaleX(0);transform-origin:left center;transition:transform 2.6s cubic-bezier(.4,0,.2,1)}
.how-fill.on{transform:scaleX(1)}
.how ol{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px}
.how li{display:flex;flex-direction:column;gap:14px}
.num{width:40px;height:40px;flex-shrink:0;border:1px solid var(--brass);border-radius:999px;background:var(--canvas);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:17px;color:var(--card)}
.how h3{font-family:var(--serif);font-weight:600;font-size:24px;line-height:1.15}
.terms{padding:14px 22px;border:1px solid var(--brass);border-radius:999px;background:rgba(22,33,39,.8);font-size:15px;line-height:22px;margin-bottom:18px}
.stepper{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:640px;margin:0 auto 36px;text-align:left}
.stepper li{display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:19px;color:var(--muted)}
.stepper li::before{content:"";display:block;height:2px;border-radius:2px;background:var(--soft);transition:background-color .5s ease}
.stepper li.done::before,.stepper li.cur::before{background:var(--accent)}
.stepper li.cur{color:var(--ink)}
.hstep{display:none;width:100%;flex-direction:column;gap:22px;animation:inx .42s var(--ease) both}
.hstep.active{display:flex}
@keyframes inx{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.types{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.type{min-height:150px;padding:24px;text-align:left;border-radius:14px;border:1px solid var(--soft);background:rgba(22,33,39,.88);color:var(--ink);transition:background-color .3s ease,border-color .3s ease,color .3s ease}
.type[aria-pressed="true"]{background:var(--card);border-color:var(--card);color:var(--deep)}
.type b{display:block;font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.15}
.type span{display:block;margin-top:10px;font-size:14px;line-height:21px;opacity:.85}
.hnav{width:100%;max-width:640px;margin:36px auto 0;display:flex;flex-direction:column;gap:14px}
.hnav .row{display:flex;align-items:center;justify-content:space-between}
.hcard{width:min(420px,calc(100vw - 48px));height:460px;perspective:1200px}
.hcard article{position:relative;width:100%;height:100%;background:var(--canvas);border:1px solid var(--brass);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;transition:transform .7s var(--ease)}
.hcard article.tilt{transition:transform .12s ease-out}
.hcard .top{padding:32px 32px 24px;display:flex;flex-direction:column;gap:18px}
.hcard .kv .k{color:var(--muted)}.hcard .kv .v{color:#fff}
.status{height:28px;padding:0 12px;display:inline-flex;align-items:center;border:1px solid var(--warn);border-radius:999px;font-size:13px;color:var(--warn);white-space:nowrap}
.hcard .perf{margin:0 24px;border-top:1.5px dashed var(--brass)}
.hcard .bottom{flex:1;padding:24px 32px 32px;display:flex;flex-direction:column;justify-content:space-between}
.next-steps{display:flex;flex-direction:column;gap:12px}
.next-steps li{padding-left:18px;border-left:1px solid var(--brass);font-size:15px;line-height:23px}

footer{position:relative;z-index:1;height:72px;flex-shrink:0;display:none;align-items:center;justify-content:space-between;padding:0 var(--pad);font-size:13px;color:var(--muted)}
footer.on{display:flex}
footer div{display:flex;gap:28px}
footer a{text-decoration:none}

/* responsive */
@media (max-width:1100px){
  .aud{grid-template-columns:repeat(2,minmax(0,1fr))}
  .types{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  :root{--head:64px;--pad:20px}
  .wordmark{font-size:12px;letter-spacing:4px}
  .nav{gap:16px}
  .nav-link{font-size:14px}
  .seal{width:260px;height:260px}
  .doors{gap:14px}
  .door{flex:1 1 0;gap:12px}
  .arch{border-radius:999px 999px 10px 10px}
  .door-title{font-size:20px}
  .door-text .small{font-size:13px}
  .skip{right:auto;left:50%;transform:translateX(-50%)}
  .tiers{grid-template-columns:1fr;gap:16px;margin:24px 0}
  .tier{padding:22px;gap:14px}
  .grid2{grid-template-columns:1fr}
  .span2{grid-column:auto}
  .done{grid-template-columns:1fr;grid-template-areas:"text" "visual" "actions";gap:20px;padding:8px 24px 32px}
  .done-actions{align-items:stretch}
  .done-actions .btn{width:100%}
  .aud{grid-template-columns:1fr;gap:14px}
  #h-aud,#hintro .layer.scrolly{justify-content:flex-start;overflow-y:auto;padding-top:8px}
  .how{margin:24px 0}
  .how-track,.how-fill{left:19px;right:auto;top:20px;bottom:20px;width:1px;height:auto}
  .how-fill{transform:scaleY(0);transform-origin:top center}
  .how-fill.on{transform:scaleY(1)}
  .how ol{grid-template-columns:1fr;gap:22px}
  .how li{flex-direction:row;gap:16px}
  .how h3{font-size:21px}
  .terms{border-radius:14px;text-align:center}
  .types{gap:12px}
  .type{min-height:130px;padding:18px}
  .type b{font-size:19px}
  .hnav{position:sticky;bottom:0;margin-top:24px;padding:12px 0 16px;background:rgba(13,21,17,.9);border-top:1px solid var(--soft)}
  footer{height:auto;padding:16px 20px;flex-direction:column;gap:8px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
